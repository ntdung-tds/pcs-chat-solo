name: Bootstrap PCS Chat Solo source
on:
  push:
    branches: [main]
    paths: ['bootstrap/part-03.b64']
permissions:
  contents: write
jobs:
  unpack-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify checksum and safely unpack complete standalone Chat Solo seed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, tarfile
          parts=[Path(f'bootstrap/part-{i:02d}.b64') for i in range(4)]
          raw=base64.b64decode(''.join(p.read_text() for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='bef2fd0c3ccc374c04b609cf91b3a4aeacef90beab02535cfc3ece93e210fa10','Edition seed SHA256 mismatch'
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members=archive.getmembers()
              assert len(members)==11,'Unexpected source file count'
              assert sum(v.size for v in members)<100_000,'Source size too large'
              for member in members:
                  p=PurePosixPath(member.name)
                  assert member.isfile() and not p.is_absolute() and all(x not in ('','.','..') for x in p.parts),'Unsafe member'
                  assert member.size<40_000,'Oversized member'
                  data=archive.extractfile(member).read()
                  target=Path(*p.parts)
                  if target.exists():
                      assert target.read_bytes()==data, 'Existing content differs: '+str(target)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(data)
          for part in parts: part.unlink()
          Path('.github/workflows/bootstrap.yml').unlink()
          Path('bootstrap').rmdir()
          PY
      - name: Verify complete Chat Solo source
        run: |
          python VERIFY_SEED.py
          python -m unittest discover -s tests -v
      - name: Publish complete Chat Solo edition
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish all verified PCS Chat Solo source files'
          git push origin HEAD:main
